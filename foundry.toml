[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Required: destructuring the 12-value `IMonadStaking.getValidator` return is stack-too-deep
# under the legacy codegen pipeline.
via_ir = true
bytecode_hash = "none"

[fuzz]
runs = 1000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
