name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Upstream Foundry >= 1.8.0 ships first-class Monad execution (`--network monad`),
      # including the staking precompile at 0x1000. Pinned so CI matches local dev.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check src test script

      - name: Build
        run: forge build --sizes

      - name: Unit tests
        run: forge test -vvv

      # Real staking precompile. REQUIRE_MONAD_PRECOMPILE makes the integration suite fail
      # instead of silently skipping if the precompile is not present.
      - name: Integration tests (Monad network)
        env:
          REQUIRE_MONAD_PRECOMPILE: "true"
        run: forge test --network monad --match-contract Integration -vvv
